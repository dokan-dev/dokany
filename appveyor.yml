-
  environment:
    global:
      DOKAN_CI_CACHE: C:\dokan_ci_cache
      CYG_CACHE: '%DOKAN_CI_CACHE%\cygwin'
      MSYS2_CACHE: '%DOKAN_CI_CACHE%\msys2-cache'
#     CHOCO_CACHE: '%DOKAN_CI_CACHE%\choco'
      WLK_INST_CACHE: '%DOKAN_CI_CACHE%\wlk_inst'
      FSTEST_DEPS_CACHE: '%DOKAN_CI_CACHE%\deps'
      DOKAN_MAIN_BUILD_JOB_NAME: "Image: Visual Studio 2026; Configuration: All"
      DOKAN_FSTEST_BUILD_JOB_NAME: "Image: Visual Studio 2026; Configuration: FsTest"

  skip_tags: true
  version: 3.0.0-{build}
  configuration:
  - All
  - FsTest

  image:
    - Visual Studio 2026
    - Visual Studio 2017
# If you suspect some changes on the AppVeyor-side breaking things,
# uncomment below. https://www.appveyor.com/updates/
#    - Previous Visual Studio 2026
#    - Previous Visual Studio 2017
  matrix:
    exclude:
      - configuration: All
        image: Visual Studio 2017
  max_jobs: 1
  cache:
  - '%CYG_CACHE% -> appveyor.yml'
  - '%MSYS2_CACHE% -> appveyor.yml'
  - '%DOKAN_CI_CACHE%\setup-x86_64.exe -> appveyor.yml'
  - '%WLK_INST_CACHE% -> scripts/install_wlk_ifstest.ps1'
  - '%FSTEST_DEPS_CACHE% -> tests/fstest/deps.json'

# To debug build issues, add your own fork to AppVeyor and uncomment below.
# Connection details will be printed to the console output.
# $blockRdp makes the build block until a file is deleted from the desktop.
#  init:
#    - ps: Invoke-Expression (Invoke-WebRequest 'https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1')
#  on_finish:
#    - ps: $blockRdp = $true; Invoke-Expression (Invoke-WebRequest 'https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1')

  install:
    - ps: |
        New-Item -ItemType Directory -Force -Path ${env:DOKAN_CI_CACHE} | Out-Null
    - ps: |
        if ($env:CONFIGURATION -eq "FsTest" -or $env:CONFIGURATION -eq "All") {
          .\cert\dokan-import.ps1
        }
    - ps: |
        if ($env:CONFIGURATION -eq "FsTest") {
          & verifier /standard /driver dokan3.sys
          Write-Host "Before reboot"
          Start-Sleep -s 30 # Wait appveyor to be ready https://github.com/appveyor/ci/issues/3650
          Restart-Computer
          Start-Sleep -s 240 # will reboot before this is finished and proceed with next build step
          Write-Host "Did not reboot for some reason, trying Restart-Computer -Force"
          Start-Sleep -s 2
          Restart-Computer -Force
          Start-Sleep -s 240
          Write-Host "Still has not rebooted"
          throw ("Tried rebooting two times, failed")
        }
    - ps: |
        . .\scripts\build_helper.ps1
    - ps: |
        if ($env:CONFIGURATION -eq "All") {
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (!$vsPath) {
            throw "Visual Studio with MSBuild not found"
          }
          Write-Host "Installing Visual Studio WDK component into $vsPath..."
          $proc = Start-Process -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe" -ArgumentList @("modify", "--installPath", "`"$vsPath`"", "--add", "Component.Microsoft.Windows.DriverKit", "--quiet", "--norestart", "--nocache") -Wait -PassThru
          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
            Get-ChildItem "$env:TEMP\dd_installer_*.log","$env:TEMP\dd_setup_*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 3 | ForEach-Object {
              Write-Host "=== $($_.FullName) (last 40 lines) ==="
              Get-Content $_.FullName -Tail 40 -ErrorAction SilentlyContinue
            }
            throw "Visual Studio Installer failed with exit code $($proc.ExitCode)"
          }
          Exec-External { & nuget restore .\sys\packages.config -PackagesDirectory .\packages }
        }
    - ps: |
        if ($env:CONFIGURATION -eq "FsTest") {
          Exec-External {& net user dokan_ifstest D0kan_1fstest /ADD }
        }
    - ps: |
        if ($env:CONFIGURATION -eq "FsTest") {
          Exec-External {& powershell .\scripts\install_wlk_ifstest.ps1 }
        }
    - git submodule update --init --recursive
    - ps: |
        if ($env:CONFIGURATION -eq "All") {
          function downloadIfOlderThanDays($url, $path, $days) {
            if ( !(Test-Path $path -NewerThan (Get-Date).AddDays(-$days)) ) {
              Write-Host "$path does not exist or is older than $days days, downloading from $url"
              Invoke-WebRequest $url -OutFile $path
            }
          }

          downloadIfOlderThanDays "https://cygwin.com/setup-x86_64.exe" "${env:DOKAN_CI_CACHE}\setup-x86_64.exe" 7

          function updateCygwin($cygwinexe, $installFolder, $cacheFolder) {
            Write-Host "Update Cygwin: $cygwinexe"
            Exec-External {& cmd /c $cygwinexe -gqnNdO -R $installFolder -s http://mirrors.kernel.org/sourceware/cygwin/ -l $cacheFolder -P cmake -P make -P gcc-core -P gcc-g++ -P pkg-config}
            Write-Host "Update Cygwin: $cygwinexe " -NoNewLine
            Write-Host "[ OK ]" -ForegroundColor Green
          }

          New-Item -ItemType Directory -Force -Path "C:\cygwin64", $env:CYG_CACHE | Out-Null
          updateCygwin "${env:DOKAN_CI_CACHE}\setup-x86_64.exe" C:/cygwin64 $env:CYG_CACHE
        }
    - ps: |
        if ($env:CONFIGURATION -eq "All" -and -not (Test-Path -LiteralPath 'C:\msys64\ucrt64\bin\gcc.exe')) {
          function msys2Bash($bash_command) {
            Write-Host "MSYS2-Bash: $bash_command"
            Exec-External { & C:\msys64\usr\bin\bash.exe --login -c $bash_command }
            Write-Host "MSYS2-Bash $bash_command " -NoNewLine
            Write-Host "[ OK ]" -ForegroundColor Green
          }

          New-Item -ItemType Directory -Force -Path $env:MSYS2_CACHE | Out-Null
          $unix_msys2_cache = (Exec-External { & C:\msys64\usr\bin\bash.exe --login -c "cygpath '${env:MSYS2_CACHE}'" })

          # AppVeyor's Visual Studio 2026 image preinstalls MINGW32/MINGW64 but not UCRT64.
          # Refresh the keyring and install only the UCRT64 GCC compiler (avoiding a full
          # pacman -Syuu upgrade; dokan_fuse/build.ps1 uses preinstalled Windows CMake and MSYS make).
          msys2Bash "pacman -Sy --needed --noconfirm --cache '$unix_msys2_cache' msys2-keyring"
          msys2Bash "pacman -S --needed --noconfirm --cache '$unix_msys2_cache' mingw-w64-ucrt-x86_64-gcc"
        }

  build_script:
  - ps: |
      Write-Host Start building...
      $buildCmd = $(cmd /c where msbuild) | Select-Object -First 1

  - ps: |
      # Available in all configurations
      $xmlversion = [xml](Get-Content "${env:APPVEYOR_BUILD_FOLDER}\dokan_wix\version.xml")
      $current_build_version = $xmlversion.Include.define | Where { $_.StartsWith("BuildVersion=") }
      $mm_version = $current_build_version.Split("=")[1] -replace '"','';
      $mm_version = $mm_version.Substring(0, $mm_version.Length - $env:APPVEYOR_BUILD_NUMBER.Length - 1);
      $mm_version += $env:APPVEYOR_BUILD_NUMBER;
      (Get-Content "${env:APPVEYOR_BUILD_FOLDER}\CHANGELOG.md") -replace '[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,4}', ($env:APPVEYOR_BUILD_VERSION.Split("-")[0] + '.' + $mm_version) | out-file "${env:APPVEYOR_BUILD_FOLDER}\CHANGELOG.md"
      $installer_version = $env:APPVEYOR_BUILD_VERSION.Split("-")[0] + '.' + $mm_version;
  - ps: |
      if ($env:CONFIGURATION -eq "All") {
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.0.*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
        if (!$signtool) {
          throw "signtool.exe not found under C:\Program Files (x86)\Windows Kits\10\bin"
        }
        $env:Path += ";$($signtool.DirectoryName)"
        $env:CERTISSUER="DokanCA"
        $env:ADDITIONALCERT="$pwd\cert\DokanCA.cer"
        $env:SIGNTOOL=$signtool.FullName

        cd dokan_wix
        $Platform = "Any CPU"
        $buildArgs = @(
        "SetAssemblyVersion.sln",
        "/m",
        "/l:C:\Program Files\AppVeyor\BuildAgent\Appveyor.MSBuildLogger.dll",
        "/p:Configuration=Release",
        "/p:Platform=${Platform}")
        Exec-External { & $buildCmd $buildArgs }

        & .\SetAssemblyVersion\bin\Release\SetAssemblyVersion ..\CHANGELOG.md version.xml ..\

        # Flip the config to Debug for a Debug build and installer
        $BuildConfig="Release"

        cd ${env:APPVEYOR_BUILD_FOLDER}
        Exec-External {& .\scripts\build.ps1 -Configurations $BuildConfig }
        .\cert\dokan-sign.ps1

        cd dokan_wix

        # Nuget restore sln fails to restore all the project of the solution for some reason so lets do it manually
        dir .\* -include ('*.wixproj', '*.vcxproj') -recurse | ForEach-Object { nuget restore $_.FullName -SolutionDirectory . }

        (gc version.xml) -replace 'BuildCygwin="false"', 'BuildCygwin="true"' | sc version.xml
        (gc version.xml) -replace 'BuildMsys2="false"', 'BuildMsys2="true"' | sc version.xml
        (gc version.xml) -replace 'Compressed="no"', 'Compressed="yes"' | sc version.xml

        $Platform = "Mixed Platforms"
        $buildArgs = @(
        "Dokan_WiX.sln",
        "/m",
        "/l:C:\Program Files\AppVeyor\BuildAgent\Appveyor.MSBuildLogger.dll",
        "/p:Configuration=${BuildConfig}",
        "/p:Platform=${Platform}")

        Exec-External {& $buildCmd $buildArgs}

        Write-Host Build archive ...
        Exec-External { 7z a -tzip dokan.zip ..\Win32 ..\x64 ..\ARM64 }
        Write-Host Build archive done !

        Write-Host Upload Artifact...
        Push-AppveyorArtifact "${env:APPVEYOR_BUILD_FOLDER}\dokan_wix\Bootstrapper\bin\x86\${BuildConfig}\DokanSetup.exe" -FileName ("DokanSetup-" + $installer_version + ".exe")
        Push-AppveyorArtifact "${env:APPVEYOR_BUILD_FOLDER}\dokan_wix\dokan.zip" -FileName ("dokan-" + $installer_version + ".zip")
        Write-Host Artifact uploaded!
      }

  - ps: |
      if ($env:CONFIGURATION -eq "FsTest") {
        Write-Host "Getting main build job id via API..."
        $api_build_info_url = "${env:APPVEYOR_URL}/api/projects/${env:APPVEYOR_ACCOUNT_NAME}/${env:APPVEYOR_PROJECT_SLUG}/build/${env:APPVEYOR_BUILD_VERSION}"
        $headers = @{
          "Content-Type" = "application/json"
        }
        $build_info = Invoke-RestMethod -Method Get -Uri $api_build_info_url -Headers $headers -UserAgent "Dokany CI-Script ${env:APPVEYOR_JOB_ID}"
        $main_build_job_id = ($build_info.Build.jobs | Where-Object {$_.name -eq $env:DOKAN_MAIN_BUILD_JOB_NAME}).jobId
        $installer_url = "${env:APPVEYOR_URL}/api/buildjobs/${main_build_job_id}/artifacts/DokanSetup-${installer_version}.exe"

        Write-Host "Downloading installer artifact from main build job ${main_build_job_id}..."
        Invoke-WebRequest $installer_url -OutFile DokanSetup.exe

        Write-Host "Installing Dokan..."
        $install_process = Start-Process -PassThru -Wait -FilePath .\DokanSetup.exe -ArgumentList @("/quiet", "/norestart", "/log", "dokan_install.log")
        if ($install_process.ExitCode -ne 0) {
          Write-Error "Dokan-Installation failed. Log below this line:"
          Get-Content dokan_install*.log   # wildcard for getting both MSI and bundle log
          throw "Dokan-Installation failed. Log above this line"
        }

        $fstestZip = "${env:APPVEYOR_BUILD_FOLDER}\dokan-fstest.zip"
        if ($env:APPVEYOR_JOB_NAME -eq $env:DOKAN_FSTEST_BUILD_JOB_NAME -or $env:APPVEYOR_BUILD_WORKER_IMAGE -like "*Visual Studio 2026") {
          $fstestBuildConfig = "Release"
          Set-Location ${env:APPVEYOR_BUILD_FOLDER}
          Exec-External { & .\scripts\build_fstest.ps1 -Configuration $fstestBuildConfig -CacheDir $env:FSTEST_DEPS_CACHE -VerifyStaticCrt }
          $fstestStageDir = "${env:APPVEYOR_BUILD_FOLDER}\tests\fstest\build\stage"
          Remove-Item -Recurse -Force $fstestStageDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $fstestStageDir | Out-Null
          Copy-Item -LiteralPath "${env:APPVEYOR_BUILD_FOLDER}\tests\fstest\build\bin\${fstestBuildConfig}\dokan_fstest.exe" -Destination $fstestStageDir -Force
          Copy-Item -LiteralPath "${env:APPVEYOR_BUILD_FOLDER}\tests\fstest\baselines" -Destination $fstestStageDir -Recurse -Force
          $fstestLicense = "${env:APPVEYOR_BUILD_FOLDER}\tests\fstest\LICENSE"
          $gtestLicense = "${env:APPVEYOR_BUILD_FOLDER}\tests\fstest\build\_deps\googletest-src\LICENSE"
          $jsonLicense = "${env:APPVEYOR_BUILD_FOLDER}\tests\fstest\LICENSE-nlohmann-json.txt"
          if (!(Test-Path -LiteralPath $fstestLicense -PathType Leaf)) {
            throw "fstest LICENSE not found at $fstestLicense"
          }
          if (!(Test-Path -LiteralPath $gtestLicense -PathType Leaf)) {
            throw "GoogleTest BSD-3-Clause LICENSE not found at $gtestLicense"
          }
          if (!(Test-Path -LiteralPath $jsonLicense -PathType Leaf)) {
            throw "nlohmann/json MIT LICENSE not found at $jsonLicense"
          }
          Copy-Item -LiteralPath $fstestLicense -Destination "$fstestStageDir\LICENSE" -Force
          Copy-Item -LiteralPath $gtestLicense -Destination "$fstestStageDir\LICENSE-googletest.txt" -Force
          Copy-Item -LiteralPath $jsonLicense -Destination "$fstestStageDir\LICENSE-nlohmann-json.txt" -Force
          $fstestZip = "${env:APPVEYOR_BUILD_FOLDER}\tests\fstest\build\dokan-fstest.zip"
          Remove-Item -Force $fstestZip -ErrorAction SilentlyContinue
          Exec-External { & 7z a -tzip $fstestZip "$fstestStageDir\*" }
          Push-AppveyorArtifact $fstestZip -FileName ("dokan-fstest-" + $installer_version + ".zip")
        } else {
          if ($PSVersionTable.PSVersion.Major -lt 6) {
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor [System.Net.SecurityProtocolType]::Tls12
          }
          $ProgressPreference = 'SilentlyContinue'
          $fstest_build_job_id = ($build_info.Build.jobs | Where-Object {$_.name -eq $env:DOKAN_FSTEST_BUILD_JOB_NAME}).jobId
          if ([string]::IsNullOrWhiteSpace($fstest_build_job_id)) {
            throw "Could not find fstest build job '$($env:DOKAN_FSTEST_BUILD_JOB_NAME)' in AppVeyor build ${env:APPVEYOR_BUILD_VERSION}"
          }
          $fstest_url = "${env:APPVEYOR_URL}/api/buildjobs/${fstest_build_job_id}/artifacts/dokan-fstest-${installer_version}.zip"
          Write-Host "Downloading fstest artifact from fstest build job ${fstest_build_job_id}..."
          $maxAttempts = 4
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Remove-Item -Force -ErrorAction SilentlyContinue $fstestZip
              Invoke-WebRequest -UseBasicParsing -Uri $fstest_url -OutFile $fstestZip
              break
            } catch {
              Write-Warning "Attempt $attempt/$maxAttempts failed downloading dokan-fstest.zip: $($_.Exception.Message)"
              if ($attempt -eq $maxAttempts) { throw }
              Start-Sleep -Seconds (5 * [Math]::Pow(2, $attempt - 1))
            }
          }
        }
        $fstestBinDir = "${env:APPVEYOR_BUILD_FOLDER}\tests\fstest\ci-bin"
        Remove-Item -Recurse -Force $fstestBinDir -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path $fstestBinDir | Out-Null
        Exec-External { & 7z x -y "-o$fstestBinDir" $fstestZip }
        if (!(Test-Path -LiteralPath "$fstestBinDir\dokan_fstest.exe" -PathType Leaf)) {
          throw "dokan_fstest.exe missing after extracting dokan-fstest.zip"
        }
        if (!(Test-Path -LiteralPath "$fstestBinDir\baselines\dokan_memfs.json" -PathType Leaf) -or !(Test-Path -LiteralPath "$fstestBinDir\baselines\dokan_mirror.json" -PathType Leaf)) {
          throw "Baseline manifests missing after extracting dokan-fstest.zip"
        }
        if (!(Test-Path -LiteralPath "$fstestBinDir\LICENSE" -PathType Leaf) -or !(Test-Path -LiteralPath "$fstestBinDir\LICENSE-googletest.txt" -PathType Leaf) -or !(Test-Path -LiteralPath "$fstestBinDir\LICENSE-nlohmann-json.txt" -PathType Leaf)) {
          throw "License files missing after extracting dokan-fstest.zip"
        }
      }
  - ps: |
      Write-Host Build finished!

  test_script:
  - ps: |
      if ($env:CONFIGURATION -eq "FsTest") {
        Write-Host Running tests...
        if (Get-Command Add-MpPreference -ErrorAction SilentlyContinue) {
          foreach ($excl in @("C:\fstest_ntfs", "C:\FSTMP", "C:\FSTMP2", "C:\DokanMount", "M:\")) {
            try {
              Add-MpPreference -ExclusionPath $excl -ErrorAction Stop
            } catch {
              Write-Warning "Defender exclusion skipped for ${excl}: $($_.Exception.Message)"
            }
          }
        }

        $resultsDir = "${env:APPVEYOR_BUILD_FOLDER}\fstest-results"
        New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null
        $fsTestExe = "${env:APPVEYOR_BUILD_FOLDER}\tests\fstest\ci-bin\dokan_fstest.exe"
        $baselinesDir = "${env:APPVEYOR_BUILD_FOLDER}\tests\fstest\ci-bin\baselines"

        $ntfsRoot = "C:\fstest_ntfs"
        if (Test-Path -LiteralPath $ntfsRoot) {
          Exec-External { & $fsTestExe "--cleanup-dir=$ntfsRoot" }
        }
        New-Item -ItemType Directory -Force -Path $ntfsRoot | Out-Null
        try {
          Write-Host "Start Real NTFS --strict Gate ($ntfsRoot)" -ForegroundColor Green
          Exec-External { & $fsTestExe "--root=$ntfsRoot" "--strict" "--json-out=$resultsDir\ntfs_strict.json" }
          Write-Host "Real NTFS --strict Gate passed!" -ForegroundColor Green
        } finally {
          if (Test-Path -LiteralPath $ntfsRoot) {
            & $fsTestExe "--cleanup-dir=$ntfsRoot"
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "dokan_fstest --cleanup-dir failed (exit $LASTEXITCODE); falling back to cmd rmdir \\?\$ntfsRoot"
              & cmd.exe /d /c "rmdir /s /q \\?\$ntfsRoot"
            }
          }
        }

        $env:DokanLibrary3 = [System.Environment]::GetEnvironmentVariable("DokanLibrary3", "Machine")
        $memfs = @("${env:DokanLibrary3}\sample\memfs\memfs.exe", "${env:DokanLibrary3}\x86\sample\memfs\memfs.exe")

        Set-Location "${env:APPVEYOR_BUILD_FOLDER}\samples"
        .\memfs_test.ps1 -Memfs $memfs -FsTestExe $fsTestExe -BaselinesDir $baselinesDir -ResultsDir $resultsDir
        .\mirror_test.ps1 -Mirrors @("${env:DokanLibrary3}\sample\mirror\mirror.exe") -FsTestExe $fsTestExe -BaselinesDir $baselinesDir -ResultsDir $resultsDir
        .\mirror_test.ps1 -Mirrors @("${env:DokanLibrary3}\x86\sample\mirror\mirror.exe") -ConfigNames @("drive", "netUnc") -FsTestExe $fsTestExe -BaselinesDir $baselinesDir -ResultsDir $resultsDir
      }
  - ps: |
      if ($env:CONFIGURATION -eq "FsTest") {
        Write-Host Test finished!
      }

  after_test:
  - ps: |
      # This function has already been defined above, but in case of a reboot caused by a BSOD, we cannot
      # rely on it being defined!
      function Exec-External {
        param(
          [Parameter(Position=0,Mandatory=1)][scriptblock] $command
        )
        & $command
        if ($LASTEXITCODE -ne 0) {
          throw ("Command returned non-zero error-code ${LASTEXITCODE}: $command")
        }
      }
  - ps: |
      if ($env:CONFIGURATION -eq "FsTest") {
        Exec-External {& verifier /query}
      }
  - ps: |
      # checking for BSOD
      $bugchecks = (Get-EventLog -LogName system | Where-Object {$_.eventID -eq '1001' -and $_.Source -eq 'BugCheck'} | Select-Object -Property *)
      if ($bugchecks) {
        Write-Host "It seems like we rebooted due to a bugcheck (BSOD)."
        Format-List -InputObject $bugchecks | Out-String | Out-Host
        # events are sorted descendingly by time, so $bugchecks[0] is the latest BSOD
        $memory_dmp = $bugchecks[0].ReplacementStrings[1]

        $kdPath = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\kd.exe"
        if (Test-Path $kdPath) {
          Write-Host Calling KD to get more information...
          # somehow the env-var-changes by the installer are sometimes lost after the BSOD. Hardcode the path!
          $driver_and_pdb_path = Resolve-Path 'C:\Program Files\Dokan\Dokan Library-*\driver\'
          & $kdPath -lines -z $memory_dmp -y "SRV*;${driver_and_pdb_path};http://msdl.microsoft.com/download/symbols" -c "!analyze -v; kp; dv /t /i /V; q"
        } else {
          Write-Host "kd.exe not installed on this image; skipping inline dump analysis."
        }
        $memdumpArchive = "memory_dmp_$(& git rev-parse --short HEAD)_${env:APPVEYOR_BUILD_VERSION}.7z"
        Write-Host "Compressing $memory_dmp"
        Exec-External { &7z a -t7z $memdumpArchive $memory_dmp }
        Push-AppveyorArtifact $memdumpArchive
        Write-Host "MEMORY.DMP uploaded as build artifact $memdumpArchive"
        Add-AppveyorMessage `
          -Category Error `
          -Message "BSOD encountered during $env:CONFIGURATION. Link to MEMORY.DMP in the description" `
          -Details ("MEMORY.DMP is available here: " + `
            "https://ci.appveyor.com/api/buildjobs/$([System.Web.HttpUtility]::UrlEncode($env:APPVEYOR_JOB_ID))/artifacts/$([System.Web.HttpUtility]::UrlEncode($memdumpArchive))")

        throw "Build failed due to BSOD during $env:CONFIGURATION"
      }

  on_finish:
  - ps: |
      if ($env:CONFIGURATION -eq "FsTest") {
        $resultsDir = "${env:APPVEYOR_BUILD_FOLDER}\fstest-results"
        if (Test-Path -LiteralPath $resultsDir -PathType Container) {
          $jsonFiles = @(Get-ChildItem -LiteralPath $resultsDir -Filter "*.json" -ErrorAction SilentlyContinue)
          if ($jsonFiles.Count -gt 0) {
            $imageSlug = ($env:APPVEYOR_BUILD_WORKER_IMAGE -replace '[^A-Za-z0-9]+', '_').Trim('_')
            $resultsZip = "${env:APPVEYOR_BUILD_FOLDER}\fstest-results-${imageSlug}-${env:APPVEYOR_BUILD_VERSION}.zip"
            Remove-Item -LiteralPath $resultsZip -Force -ErrorAction SilentlyContinue
            & 7z a -tzip $resultsZip "$resultsDir\*.json" | Out-Null
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $resultsZip -PathType Leaf)) {
              Push-AppveyorArtifact $resultsZip
              Write-Host "Uploaded fstest scorecards: $resultsZip"
            }
          }
        }
      }
